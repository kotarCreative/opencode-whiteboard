<!doctype html>
<html style="height:100%">
  <head>
    <meta charset="UTF-8" />
    <title>embed layout</title>
    <style>
      /* The host utilities the panel uses to size an embed box. This mirrors the app's CSS
         contract; the point of the test is that BoardView actually applies a sizing class. */
      .absolute { position: absolute; }
      .relative { position: relative; }
      .inset-0 { inset: 0; }
      .h-full { height: 100%; }
      .w-full { width: 100%; }
      .size-full { width: 100%; height: 100%; }
      .flex-1 { flex: 1 1 0%; }
      .min-h-0 { min-height: 0; }
    </style>
  </head>
  <body style="height:100%;margin:0">
    <div id="root" style="height:100%"></div>
    <script type="module" src="./entry.tsx"></script>
  </body>
</html>
